name: Release

# Every merge to main cuts a timestamped prerelease. The version is the
# upstream package.json version plus a UTC build stamp:
#
#   X.Y.Z-thecodedrift.YYYYMMDDhhmmss
#   e.g. 1.0.0-thecodedrift.20260724034934
#
# X.Y.Z is the upstream version from package.json; the 14-digit stamp is when
# the build ran (UTC). A single numeric identifier keeps the tag valid semver.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Only build-affecting changes cut a release — docs/skills/CI merges don't.
    paths:
      - "src/**"
      - "package.json"
      - "webpack.config.js"

permissions:
  contents: write

# Serialize releases on main so two quick merges can't race on tag creation.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Compute version and plugin name
        id: meta
        run: |
          base=$(node -p "require('./package.json').version")
          plugin=$(node -p "require('./package.json').scriptOutputName")
          # UTC YYYYMMDDhhmmss as a single numeric identifier (valid semver).
          stamp=$(date -u +'%Y%m%d%H%M%S')
          version="${base}-thecodedrift.${stamp}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "plugin=${plugin}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} (dist/${plugin}.js)"

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.version }}
          prerelease: true
          draft: false
          files: dist/${{ steps.meta.outputs.plugin }}.js
          body: |
            Automated build of `${{ steps.meta.outputs.plugin }}.js` from
            [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            Download the `.js` asset below and load it in Firebot via
            **Settings → Scripts**.
